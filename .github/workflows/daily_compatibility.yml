name: HA Daily Compatibility Check
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  compatibility:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["stable", "dev"]
        python-version: ["auto"]
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python version for HA dev
        id: detect-python
        run: |
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            raw_spec=$(curl -s https://raw.githubusercontent.com/home-assistant/core/dev/pyproject.toml | grep '^requires-python' | cut -d '"' -f2)
            python_version=$(printf '%s' "$raw_spec" | python3 -c "import re, sys; specifier = sys.stdin.read().strip(); match = re.search(r'(\\d+)\\.(\\d+)', specifier); assert match, f'Unable to parse Python version from: {specifier}'; print(f'{match.group(1)}.{match.group(2)}')")
            echo "Detected HA dev Python requirement: $raw_spec -> $python_version"
            echo "python_version=$python_version" >> $GITHUB_OUTPUT
          else
            echo "python_version=3.14" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.detect-python.outputs.python_version }}
          cache: 'pip'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Install Home Assistant (${{ matrix.ha-version }})
        run: |
          if [ "${{ matrix.ha-version }}" == "dev" ]; then
            pip install --upgrade "homeassistant @ git+https://github.com/home-assistant/core.git@dev"
          else
            pip install --upgrade homeassistant pytest-homeassistant-custom-component
          fi
      - name: Show installed HA version
        run: pip show homeassistant | grep Version
      - name: Run tests
        run: |
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            python -c "import homeassistant.components.logger as logger; from homeassistant.components.logger.helpers import _clear_logger_overwrites; logger._clear_logger_overwrites = _clear_logger_overwrites; import pytest; raise SystemExit(pytest.main(['tests/', '-v', '--tb=short']))"
          else
            python -m pytest tests/ -v --tb=short
          fi
      - name: Capture tested stable Home Assistant version
        if: matrix.ha-version == 'stable'
        run: python -c "from importlib.metadata import version; print(version('homeassistant'))" > tested-version.txt
      - name: Upload tested stable Home Assistant version
        if: matrix.ha-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: tested-ha-version
          path: tested-version.txt
      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Compatibility check failed: HA ${{ matrix.ha-version }}`;
            const body = `The daily compatibility check failed for **HA ${{ matrix.ha-version }}** on Python ${{ matrix.python-version }}.\n\n[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'compatibility'
            });
            const existing = issues.data.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['compatibility', 'bug']
              });
            }

  publish-tested-version:
    if: github.ref == 'refs/heads/master'
    needs: compatibility
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: tested-ha-version
      - name: Update tested version badge data
        run: |
          python -c "import json; from pathlib import Path; version = Path('tested-version.txt').read_text().strip(); Path('docs/home_assistant_compatibility.json').write_text(json.dumps({'tested_version': version}, indent=2) + '\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/home_assistant_compatibility.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update tested Home Assistant version"
          git pull --rebase origin master
          git push origin master